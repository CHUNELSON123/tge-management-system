name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tge_qa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tge_qa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable service credentials only; CI never connects to production.
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/tge_qa_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/tge_qa_ci?schema=public
      JWT_SECRET: ci-only-signing-key-at-least-32-characters
      CLIENT_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      RESEND_API_KEY: ci-placeholder-not-a-provider-key
      EMAIL_FROM: ci@example.invalid
      ACTIVATION_URL: http://localhost:3000/activate-account
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            database/package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Require SQL migrations for schema changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if grep -Eq '^database/prisma/.*\.prisma$' <<< "$changed"; then
            added=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD)
            if ! grep -Eq '^database/prisma/migrations/[^/]+/migration\.sql$' <<< "$added"; then
              echo "::error::Schema changes require a new reviewed SQL migration."
              exit 1
            fi
          fi
      - name: Install database dependencies
        run: npm ci --prefix database
      - name: Validate, generate and build database client
        run: |
          npm run db:validate --prefix database
          npm run db:generate --prefix database
          npm run db:build --prefix database
      - name: Apply migrations to disposable PostgreSQL
        run: |
          npm run db:migrate:deploy --prefix database
          npm exec --prefix database -- prisma migrate status --config database/prisma7.config.ts
      - name: Install server and client dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
      - name: Lint client
        run: npm run lint --prefix client -- --max-warnings=0
      - name: Typecheck and build server
        run: |
          npm run typecheck --prefix server
          npm run build --prefix server
      - name: Run server, client and database integration tests
        run: |
          node --test server/scripts/run-tests.test.mjs
          npm test --prefix server
      - name: Test production error responses
        run: node --test server/dist/common/middleware/error-handler.middleware.test.js
      - name: Typecheck client
        run: npm exec --prefix client -- tsc --noEmit --project client/tsconfig.json
      - name: Build client
        run: npm run build --prefix client

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Block moderate or higher dependency vulnerabilities
        run: |
          npm audit --prefix database --audit-level=moderate
          npm audit --prefix server --audit-level=moderate
          npm audit --prefix client --audit-level=moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  gate:
    name: Release gate
    if: always()
    needs: [quality, dependencies, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality and security checks
        env:
          QUALITY: ${{ needs.quality.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY" = success
          test "$DEPENDENCIES" = success
          test "$CODEQL" = success
