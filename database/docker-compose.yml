services:
  postgres:
    image: postgres:17
    container_name: tge-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - tge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tge-postgres-data: